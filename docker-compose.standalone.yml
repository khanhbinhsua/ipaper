# Production stack STANDALONE — dùng cho VPS trống (không có nginx chung).
# Caddy tự lo HTTPS Let's Encrypt. Chạy:
#   docker compose -f docker-compose.standalone.yml --env-file .env.prod up -d --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: ipaper_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ipaper_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # S3-compatible storage. Dùng SeaweedFS vì minio/minio bị remove khỏi Docker Hub (2026).
  # SeaweedFS exposes S3 API trên cổng 8333 — backend kết nối qua service-alias ipaper-minio:8333.
  minio:
    image: chrislusf/seaweedfs:3.73
    container_name: ipaper_minio
    restart: unless-stopped
    command: >
      server
      -dir=/data
      -master.volumeSizeLimitMB=50000
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs-s3.json
    volumes:
      - minio_data:/data
      - ./deploy/seaweedfs-s3.json:/etc/seaweedfs-s3.json:ro
    networks:
      default:
        aliases: [ipaper-minio]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ipaper_backend
    restart: unless-stopped
    env_file: .env.prod
    # Mount file Firebase Admin (optional — không có file thì push tắt, Socket.IO vẫn OK)
    volumes:
      - ./backend/firebase-admin.json:/app/firebase-admin.json:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ipaper_frontend
    restart: unless-stopped
    depends_on:
      - backend

  # Caddy tự xin + gia hạn HTTPS Let's Encrypt. Domain đọc từ .env.prod (APP_DOMAIN)
  caddy:
    image: caddy:2-alpine
    container_name: ipaper_caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
